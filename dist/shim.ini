; daytona-shim settings. Put this file next to Daytona.exe; every key is
; optional, and the values below are the defaults. DaytonaLauncher.exe edits
; them for you.

[Input]
; 1: pads and wheels through SDL3.dll (Xbox, PlayStation, Switch and more).
; 0: XInput pads only (Xbox pads and Steam Input).
SDL=1

[Pad]
; A pad button or axis per action, by position (the same on every brand):
; a (bottom), b (right), x (left), y (top), back, start, leftshoulder,
; rightshoulder, leftstick, rightstick, dpup, dpdown, dpleft, dpright,
; misc1, paddle1-4, touchpad; axes leftx, lefty, rightx, righty,
; lefttrigger, righttrigger; none. Gas and brake take a button or an axis.
Steering=leftx
Gas=righttrigger
Brake=lefttrigger
Start=start
Coin=back
ShiftUp=rightshoulder
ShiftDown=leftshoulder
View1=y
View2=x
View3=b
View4=a
Gear1=none
Gear2=none
Gear3=none
Gear4=none

[Wheel]
; Wheels SDL recognises are found by themselves. Name= takes any other
; joystick whose name contains this text as a wheel, e.g. Name=Fanatec
Name=
; Axis numbers. shim.log lists "axis N moved" as you turn and press the
; pedals, and "button N pressed" for each button.
SteeringAxis=0
GasAxis=1
BrakeAxis=2
; 1.0: full lock at the end of the wheel's travel. 2.0: at half of it (or set
; the rotation to about 270 degrees in the wheel's own software). A negative
; value turns the other way.
SteeringScale=1.0
; Where a released pedal sits: auto, high or low.
PedalRest=auto
; Wheel buttons (-1: none). The defaults suit a Logitech G29 / G923 with its
; H-shifter's first four gears.
Start=9
Coin=8
ShiftUp=4
ShiftDown=5
View1=3
View2=1
View3=2
View4=0
Gear1=12
Gear2=13
Gear3=14
Gear4=15

[ForceFeedback]
Enabled=1
; Percent, 0 to 200. Strength is for wheels, Rumble for pads.
Strength=100
Rumble=100
; 1 if the wheel pulls the wrong way.
Invert=0
